<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Skill Tracker</title>
   <link rel="stylesheet" href="style2.css">
   <script src="script.js" defer></script>
   <script>
  if (!localStorage.getItem("loggedInUser")) {
      window.location.href = "login.html";
  }
</script>
</head>
<body>

  <div class="container">
        <div id="selection-screen">
            <h1>Choose Your Career Path</h1>
            <p style="text-align: center; margin-bottom: 2rem;">Select a role to view the required skills and generate your learning path.</p>
            <div class="grid" id="career-buttons">
                </div>
        </div>

        <div id="dashboard-screen" class="hidden">
            <button class="btn-outline" id="btn-change-career">← Change Career Path</button>
            <h2 id="career-title">Career Title</h2>
            <p>Mark the skills you already possess. The ones left unchecked will populate your learning action plan below.</p>
            
            <div id="skills-form">
                </div>

            <div id="action-plan-container">
                <h3>Your Learning Action Plan</h3>
                <div id="action-plan-list">
                    </div>
            </div>
        </div>
    </div>
    
</body>
</html>
